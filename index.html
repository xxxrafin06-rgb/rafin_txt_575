<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{ site_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ac:{{ theme_color }};--ac-soft:{{ theme_color }}22;--glow:{{ theme_color }}66}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090f;font-family:'Sora',sans-serif;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}

.aurora{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(120px);opacity:.4;mix-blend-mode:screen;animation:drift 20s ease-in-out infinite}
.aurora span:nth-child(1){width:520px;height:520px;background:var(--ac);top:-15%;left:-10%}
.aurora span:nth-child(2){width:460px;height:460px;background:#4f46e5;bottom:-20%;right:-10%;animation-delay:-7s}
.aurora span:nth-child(3){width:380px;height:380px;background:#06b6d4;top:40%;left:60%;animation-delay:-13s}
@keyframes drift{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(70px,-60px) scale(1.1)}}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.025) 1px,transparent 1px);background-size:60px 60px;mask-image:radial-gradient(ellipse at center,black,transparent 75%)}

.wrap{position:relative;z-index:5;width:100%;max-width:400px}
.card{background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:44px 36px 36px;backdrop-filter:blur(24px) saturate(140%);box-shadow:0 40px 80px -20px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.06) inset;animation:rise .8s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{opacity:0;transform:translateY(28px) scale(.97)}to{opacity:1;transform:none}}

.mark{width:80px;height:80px;margin:0 auto 24px;border-radius:24px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 30%,#000));display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 20px 50px -12px var(--glow),0 1px 0 rgba(255,255,255,.4) inset}
.mark span{font-family:'Sora';font-weight:700;font-size:26px;color:#fff;letter-spacing:-1px;text-shadow:0 2px 10px rgba(0,0,0,.3)}
.mark::before{content:'';position:absolute;inset:-8px;border-radius:32px;border:1px dashed rgba(255,255,255,.15);animation:spin 20s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

.brand{text-align:center;font-family:'Sora';font-weight:700;font-size:28px;letter-spacing:-.8px;margin-bottom:8px;color:#fff}
.brand em{font-style:normal;background:linear-gradient(135deg,var(--ac),#fff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.tag{text-align:center;font-family:'JetBrains Mono';font-size:10px;color:rgba(255,255,255,.35);letter-spacing:4px;text-transform:uppercase;margin-bottom:34px}
.tag::before,.tag::after{content:'◆';margin:0 8px;opacity:.5;color:var(--ac)}

.lbl{display:block;font-family:'JetBrains Mono';font-size:10.5px;color:rgba(255,255,255,.45);letter-spacing:2px;text-transform:uppercase;margin-bottom:10px}
.field{position:relative;margin-bottom:14px}
.field input{width:100%;padding:16px 18px 16px 48px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:16px;color:#fff;font-family:'JetBrains Mono';font-size:14px;letter-spacing:1px;outline:none;transition:all .25s}
.field input::placeholder{color:rgba(255,255,255,.2);letter-spacing:2px}
.field input:focus{border-color:var(--ac);background:rgba(0,0,0,.5);box-shadow:0 0 0 4px var(--ac-soft),0 0 30px -8px var(--glow)}
.field .ic{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.35);font-size:15px;transition:color .25s}
.field input:focus~.ic{color:var(--ac)}

.err{margin-bottom:14px;padding:12px 16px;background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.25);border-radius:14px;font-family:'JetBrains Mono';font-size:12px;color:#fca5a5;display:flex;align-items:center;gap:10px;animation:shake .4s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.err::before{content:'!';width:18px;height:18px;border-radius:50%;background:#ef4444;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:11px;flex-shrink:0}

.btn{width:100%;padding:16px;background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 55%,#000));border:none;border-radius:16px;color:#fff;font-family:'Sora';font-weight:600;font-size:14px;letter-spacing:2px;cursor:pointer;text-transform:uppercase;box-shadow:0 14px 34px -10px var(--glow),0 1px 0 rgba(255,255,255,.3) inset;transition:all .25s;position:relative;overflow:hidden}
.btn::after{content:'';position:absolute;inset:0;background:linear-gradient(120deg,transparent 30%,rgba(255,255,255,.25) 50%,transparent 70%);background-size:220% 100%;animation:shine 3s linear infinite}
@keyframes shine{from{background-position:200% 0}to{background-position:-200% 0}}
.btn:hover{transform:translateY(-2px);box-shadow:0 20px 44px -10px var(--glow),0 1px 0 rgba(255,255,255,.3) inset}
.btn:active{transform:translateY(0)}

.foot{margin-top:26px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;align-items:center;font-family:'JetBrains Mono';font-size:10px;color:rgba(255,255,255,.3);letter-spacing:1.5px}
.foot .s{display:flex;align-items:center;gap:6px}
.foot .s i{width:6px;height:6px;border-radius:50%;background:#22c55e;box-shadow:0 0 8px #22c55e;font-style:normal;animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="grid"></div>

<div class="wrap">
  <div class="card">
    <div class="mark"><span>RT</span></div>
    <div class="brand">{{ site_name.split(' ')[0] }} <em>{{ site_name.split(' ')[1] if site_name.split(' ')|length > 1 else '' }}</em></div>
    <div class="tag">Secure Access</div>

    {% if error %}<div class="err">{{ error }}</div>{% endif %}

    <form method="POST">
      <label class="lbl">Access Key</label>
      <div class="field">
        <input type="password" name="password" placeholder="••••••••••" required autofocus>
        <span class="ic">⬢</span>
      </div>
      <button class="btn" type="submit">Unlock</button>
    </form>

    <div class="foot">
      <div class="s"><i></i>Encrypted</div>
      <div>{{ site_name }}</div>
    </div>
  </div>
</div>
</body>
</html>
