<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Maintenance · {{ site_name }}</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ac:{{ theme_color }}}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#08090f;font-family:'Sora',sans-serif;color:#e8eaf0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;overflow:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg span{position:absolute;border-radius:50%;filter:blur(140px);opacity:.3}
.bg span:nth-child(1){width:520px;height:520px;background:#ef4444;top:-180px;left:-150px}
.bg span:nth-child(2){width:460px;height:460px;background:#4f46e5;bottom:-180px;right:-150px}
.card{position:relative;z-index:5;width:100%;max-width:430px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.08);border-radius:28px;padding:48px 36px;text-align:center;backdrop-filter:blur(24px);box-shadow:0 40px 90px -25px rgba(0,0,0,.9);animation:rise .7s cubic-bezier(.2,.9,.3,1.15)}
@keyframes rise{from{opacity:0;transform:translateY(28px)}to{opacity:1;transform:none}}
.ic{width:80px;height:80px;margin:0 auto 24px;border-radius:24px;background:linear-gradient(135deg,#ef4444,color-mix(in srgb,#ef4444 30%,#000));display:flex;align-items:center;justify-content:center;font-size:34px;box-shadow:0 20px 50px -12px #ef444488,0 1px 0 rgba(255,255,255,.3) inset;animation:pulse 2.5s ease-in-out infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.title{font-family:'Sora';font-size:28px;font-weight:700;letter-spacing:-.6px;color:#fff;margin-bottom:10px}
.sub{font-family:'JetBrains Mono';font-size:10.5px;color:rgba(255,255,255,.4);letter-spacing:3px;text-transform:uppercase;margin-bottom:28px}
.msg{padding:20px 22px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.08);border-radius:16px;font-family:'JetBrains Mono';font-size:13px;color:rgba(255,255,255,.7);line-height:1.7;text-align:left}
.msg::before{content:'> ';color:#ef4444;font-weight:700}
.foot{margin-top:26px;font-family:'JetBrains Mono';font-size:10.5px;color:rgba(255,255,255,.3);letter-spacing:2px;text-transform:uppercase}
</style>
</head>
<body>
<div class="bg"><span></span><span></span></div>
<div class="card">
  <div class="ic">⚙</div>
  <div class="title">Under Maintenance</div>
  <div class="sub">{{ site_name }}</div>
  <div class="msg">{{ message }}</div>
  <div class="foot">Please check back soon</div>
</div>
</body>
</html>
